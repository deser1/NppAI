name: Frozen copy-transition and exact-hit drift diagnostic
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/copy-transition.yml'
      - 'scripts/copy_transition_diagnostic.py'
      - 'tests/test_copy_transition_diagnostic.py'
      - 'evaluation/copy-transition-v1.json'
permissions:
  contents: read
  actions: read
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      MKL_CBWR: COMPATIBLE
      ATEN_CPU_CAPABILITY: default
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.15'
      - name: Install pinned CPU runtime
        run: |
          python -m pip install 'torch==2.14.1+cpu' 'numpy==2.5.2' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'pydantic>=2.7,<3'
      - name: Verify actual causal readout and unchanged decoder semantics
        run: python -m unittest discover -s tests -p 'test_copy_transition_diagnostic.py' -v
      - name: Download exact frozen namespace models
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api 'repos/${{ github.repository }}/actions/artifacts/12096660315/zip' > source.zip
      - name: Read frozen models without optimization or code execution
        run: python scripts/copy_transition_diagnostic.py --archive source.zip --dataset evaluation/instruction-v3 --output measured
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: copy-transition-diagnostic
          path: measured/
          retention-days: 14
