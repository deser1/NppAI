name: Staged code fitting and direct replay
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/staged-code-fit.yml'
      - 'scripts/staged_code_fit.py'
      - 'scripts/audit_staged_code_fit.py'
      - 'evaluation/staged-code-fit-v1.json'
      - 'tests/test_staged_code_fit*.py'
permissions:
  contents: read
  actions: read
jobs:
  fit-and-validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.15'
      - name: Install measured CPU runtime
        run: |
          python -m pip install 'torch==2.14.1+cpu' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'numpy==2.5.2' 'pydantic>=2.7,<3'
      - name: Test replay allocation, retained-hit accounting and actual gradients
        run: python -m unittest discover -s tests -p 'test_staged_code_fit*.py' -v
      - name: Download pinned staged-mixture initialization
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api 'repos/${{ github.repository }}/actions/artifacts/12149182157/zip' > original.zip
      - name: Prepare isolated authored functional tests
        run: |
          docker pull python:3.12-slim
          printf 'NPPAI_VALIDATION_IMAGE=%s\n' "$(docker image inspect python:3.12-slim --format '{{.Id}}')" >> "$GITHUB_ENV"
      - name: Train both fixed-budget arms and measure complete replies
        run: python scripts/staged_code_fit.py --archive original.zip --output measured --image "$NPPAI_VALIDATION_IMAGE"
      - name: Recompute raw metrics, retention and execution evidence
        run: python scripts/audit_staged_code_fit.py measured
      - name: Require validator cleanup
        if: always()
        run: test -z "$(docker ps -aq --filter name=nppai-validate-)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nppai-staged-code-fit
          path: measured/
          retention-days: 14
