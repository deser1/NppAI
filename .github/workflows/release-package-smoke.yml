name: Published release ZIP smoke
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/release-package-smoke.yml'
      - '.github/workflows/release.yml'
      - 'scripts/smoke_release_package.py'
jobs:
  smoke:
    runs-on: windows-2022
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Download published v0.4.0 packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download v0.4.0 --pattern 'NppAI-*.zip' --dir packages
      - name: Check all ZIPs and load production x64 DLL
        shell: pwsh
        run: |
          foreach ($arch in @('x86', 'arm64', 'x64')) {
            $load = @()
            if ($arch -eq 'x64') { $load = @('--load-dll') }
            python scripts/smoke_release_package.py "packages/NppAI-$arch.zip" @load
            if ($LASTEXITCODE -ne 0) { throw "Package smoke failed: $arch" }
          }
