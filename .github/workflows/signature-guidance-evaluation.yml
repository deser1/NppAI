name: Signature-guided native generation
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/evaluate_signature_guidance.py'
      - 'tests/test_signature_guidance.py'
      - 'test_engine.cpp'
      - '.github/workflows/signature-guidance-evaluation.yml'
jobs:
  evaluate:
    runs-on: windows-2022
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - name: Validate explicit signature contract
        run: python -m unittest tests.test_signature_guidance
      - name: Install CPU reference runtime
        run: |
          python -m pip install numpy
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Download measured v2 checkpoint
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 38314121142 --name nppai-broader-instruction-v2 --dir checkpoint
      - name: Build native generation runner
        run: |
          cmake -S . -B build-guidance -A x64
          cmake --build build-guidance --config Release --target TestEngine
      - name: Compare free and guided output on regression tasks
        run: >-
          python scripts/evaluate_signature_guidance.py
          --model checkpoint/NppAI-broader-instruction.nppai
          --dataset evaluation/instruction-v2/test.json
          --native build-guidance/Release/TestEngine.exe
          --output signature-guidance-report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nppai-signature-guidance-report
          path: signature-guidance-report.json
          retention-days: 14
