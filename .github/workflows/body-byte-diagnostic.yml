name: Frozen body argument byte diagnostic
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/diagnose_body_bytes.py'
      - 'tests/test_body_byte_diagnostic.py'
      - '.github/workflows/body-byte-diagnostic.yml'
jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install fixed CPU runtime
        run: python -m pip install 'torch==2.14.1+cpu' 'numpy==2.5.2' --index-url https://download.pytorch.org/whl/cpu
      - name: Verify body byte offsets, causal prefixes and raw audits
        run: python -m unittest tests.test_body_byte_diagnostic tests.test_body_loss_masking tests.test_wording_continuation -v
      - name: Download pinned matched loss models and source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 38702282716 --repo '${{ github.repository }}' --name nppai-body-loss-full_response --dir full-response
          gh run download 38702282716 --repo '${{ github.repository }}' --name nppai-body-loss-body_only --dir body-only
      - name: Compare gold-prefix body argument bytes and cached generation
        run: python scripts/diagnose_body_bytes.py --full-response full-response --body-only body-only --dataset evaluation/instruction-v3 --output body-bytes
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nppai-body-byte-diagnostic
          path: body-bytes/
          retention-days: 14
