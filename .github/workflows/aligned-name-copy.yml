name: Matched source-aligned name-copy objective
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/aligned-name-copy.yml'
      - 'scripts/aligned_name_copy.py'
      - 'tests/test_aligned_name_copy.py'
jobs:
  experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install fixed CPU training runtime
        run: |
          python -m pip install 'torch==2.14.1+cpu' 'numpy==2.5.2' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'pydantic>=2.7,<3'
      - name: Verify aligned indices, real gradients and unchanged forward/export
        run: python -m unittest discover -s tests -p 'test_aligned_name_copy.py' -v
      - name: Download pinned source checkpoint
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 38702282716 --repo '${{ github.repository }}' --name nppai-body-loss-full_response --dir source
      - name: Repeat control and compare objective on the same host
        run: python scripts/aligned_name_copy.py --source source --dataset evaluation/instruction-v3 --output measured
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nppai-aligned-copy-paired
          path: measured/
          retention-days: 14
