name: Identifier copying from real code prompts
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/train_identifier_headers.py'
      - 'tests/test_identifier_headers.py'
      - '.github/workflows/identifier-header-experiment.yml'
jobs:
  experiment:
    strategy:
      fail-fast: false
      matrix:
        task: [headers, full-code]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install measured CPU runtime
        run: python -m pip install 'torch==2.14.1+cpu' 'numpy==2.5.2' --index-url https://download.pytorch.org/whl/cpu
      - name: Check derived headers and frozen metrics
        run: python -m unittest tests.test_identifier_headers tests.test_identifier_training tests.test_identifier_diagnostics tests.test_instruction_dataset
      - name: Train headers on original code prompts
        if: matrix.task == 'headers'
        run: python scripts/train_identifier_headers.py --dataset evaluation/instruction-v3 --output header-experiment --steps 6000
      - name: Train simultaneous full-code control
        if: matrix.task == 'full-code'
        run: python scripts/train_broader_instruction_experiment.py --dataset evaluation/instruction-v3 --output header-experiment --steps 6000 --identifier-weight 1 --training-names 512
      - name: Diagnose reloaded full-code checkpoint
        if: matrix.task == 'full-code'
        run: python scripts/diagnose_identifier_copy.py --model header-experiment/NppAI-broader-instruction.nppai --dataset evaluation/instruction-v3 --output header-experiment/identifier-diagnostics.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nppai-real-prompt-${{ matrix.task }}
          path: header-experiment/
          retention-days: 14
