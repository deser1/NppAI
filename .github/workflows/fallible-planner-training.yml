name: Coder training on observed fallible plans
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/fallible_planner_training.py'
      - 'evaluation/fallible-planner-v1.json'
      - 'tests/test_fallible_planner*.py'
      - '.github/workflows/fallible-planner-training.yml'
permissions:
  contents: read
  actions: read
jobs:
  measure:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.15'
      - name: Install measured runtime
        run: |
          python -m pip install 'torch==2.14.1+cpu' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'numpy==2.5.2' 'pydantic>=2.7,<3'
      - name: Verify training-only provenance
        run: python -m unittest discover -s tests -p 'test_fallible_planner*.py' -v
      - name: Download pinned own-model initialization
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api 'repos/${{ github.repository }}/actions/artifacts/12149182157/zip' > source.zip
      - name: Prepare validator
        run: |
          docker pull python:3.12-slim
          echo "NPPAI_VALIDATION_IMAGE=$(docker image inspect python:3.12-slim --format '{{.Id}}')" >> "$GITHUB_ENV"
      - name: Fit paired coders and validate actual outputs
        run: python scripts/fallible_planner_training.py --archive source.zip --output measured --image "$NPPAI_VALIDATION_IMAGE"
      - name: Require validator cleanup
        if: always()
        run: test -z "$(docker ps -aq --filter name=nppai-validate-)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nppai-fallible-planner-training
          path: measured/
          retention-days: 14
