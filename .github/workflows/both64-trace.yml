name: Both64 saved tensor localization
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/both64-trace.yml'
      - 'scripts/both64_trace.py'
      - 'tests/test_both64_trace.py'
permissions:
  contents: read
  actions: read
jobs:
  trace:
    strategy:
      fail-fast: false
      matrix:
        profile: [historical-v1, portable-cpu-v1]
        replica: [1, 2, 3, 4]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.15'
      - name: Install pinned CPU runtime
        run: |
          python -m pip install 'torch==2.14.1+cpu' 'numpy==2.5.2' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'pydantic>=2.7,<3'
      - name: Test trace contracts
        run: python -m unittest discover -s tests -p 'test_both64_trace.py' -v
      - name: Download pinned source
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 38702282716 --repo '${{ github.repository }}' --name nppai-body-loss-full_response --dir source
      - name: Compare one untraced and two traced first steps
        env:
          PROFILE: ${{ matrix.profile }}
        run: |
          if [ "$PROFILE" = portable-cpu-v1 ]; then
            export MKL_CBWR=COMPATIBLE ATEN_CPU_CAPABILITY=default OMP_NUM_THREADS=1 OPENBLAS_NUM_THREADS=1
          fi
          python scripts/both64_trace.py --source source --dataset evaluation/instruction-v3 --output measured --profile "$PROFILE"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: both64-report-${{ matrix.profile }}-${{ matrix.replica }}
          path: |
            measured/report.json
            measured/*/events.json
            measured/*/saved.json
            measured/*/ignored-non-aten.json
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: both64-tensors-${{ matrix.profile }}-${{ matrix.replica }}
          path: measured/0/tensors/
          retention-days: 14
  compare:
    needs: trace
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.15'
      - uses: actions/download-artifact@v4
        with:
          pattern: both64-report-*
          path: replicas
      - name: Locate first observed operator differences and report CPU coverage
        run: python -S scripts/both64_trace.py --compare replicas
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: both64-comparison
          path: replicas/comparison.json
          retention-days: 14
