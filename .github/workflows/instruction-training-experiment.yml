name: Held-out instruction training experiment
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/train_instruction_experiment.py'
      - '.github/workflows/instruction-training-experiment.yml'
jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install reference runtime
        run: |
          python -m pip install numpy
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Train with response-only loss and score unseen tasks
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 38176338536 --name nppai-repository-baseline --dir prior-baseline
          python scripts/train_instruction_experiment.py --output instruction-experiment --steps 2000 --baseline prior-baseline/NppAI-repository-baseline.nppai
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nppai-held-out-instruction-experiment
          path: instruction-experiment/
          retention-days: 14
