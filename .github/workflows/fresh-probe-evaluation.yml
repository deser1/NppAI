name: Frozen continuation fresh probe evaluation
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/evaluate_fresh_probe.py'
      - 'tests/test_fresh_evaluation.py'
      - '.github/workflows/fresh-probe-evaluation.yml'
jobs:
  evaluate:
    strategy:
      fail-fast: false
      matrix:
        policy: [four_forms, eight_forms]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install measured CPU runtime
        run: python -m pip install 'torch==2.14.1+cpu' 'numpy==2.5.2' --index-url https://download.pytorch.org/whl/cpu
      - name: Validate frozen bytes and independent evidence audit
        run: python -m unittest tests.test_fresh_evaluation tests.test_fresh_probe tests.test_wording_continuation -v
      - name: Download preselected continuation pair and initial pair
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 38618406741 --repo '${{ github.repository }}' --name nppai-continuation-evaluation-${{ matrix.policy }} --dir source
          gh run download 38582420228 --repo '${{ github.repository }}' --name nppai-diverse-evaluation-four_forms --dir initial
      - name: Verify sources and measure fresh probe without optimization
        run: python scripts/evaluate_fresh_probe.py --source source --initial initial --dataset evaluation/fresh-probe-v1 --output fresh-evaluation --policy ${{ matrix.policy }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nppai-fresh-evaluation-${{ matrix.policy }}
          path: fresh-evaluation/
          retention-days: 14
