name: Frozen portable checkpoint quality
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/portable-quality.yml'
      - 'scripts/portable_quality.py'
      - 'tests/test_portable_quality.py'
      - 'evaluation/portable-quality-v1.json'
permissions:
  contents: read
  actions: read
jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      MKL_CBWR: COMPATIBLE
      ATEN_CPU_CAPABILITY: default
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.15'
      - name: Install pinned CPU runtime
        run: |
          python -m pip install 'torch==2.14.1+cpu' 'numpy==2.5.2' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'pydantic>=2.7,<3'
      - name: Test frozen inputs and raw-output scoring
        run: python -m unittest discover -s tests -p 'test_portable_quality.py' -v
      - name: Download exact original training archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api 'repos/${{ github.repository }}/actions/artifacts/12072377313/zip' > training.zip
      - name: Resolve immutable isolated validator
        run: |
          docker pull python:3.12-slim
          printf 'NPPAI_VALIDATION_IMAGE=%s\n' "$(docker image inspect python:3.12-slim --format '{{.Id}}')" >> "$GITHUB_ENV"
      - name: Evaluate frozen exports without training or repair
        run: python scripts/portable_quality.py --archive training.zip --dataset evaluation/instruction-v3 --tasks evaluation/gated-copy-probes-v1/tasks.json --output measured --image "$NPPAI_VALIDATION_IMAGE"
      - name: Require container cleanup
        if: always()
        run: test -z "$(docker ps -aq --filter name=nppai-validate-)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: portable-quality
          path: measured/
          retention-days: 14
