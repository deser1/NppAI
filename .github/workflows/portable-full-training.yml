name: Portable full-training repeatability
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/portable-full-training.yml'
      - 'scripts/portable_full_training.py'
      - 'tests/test_portable_full_training.py'
permissions:
  contents: read
  actions: read
jobs:
  measure:
    strategy:
      fail-fast: false
      matrix:
        replica: [1, 2, 3, 4]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      MKL_CBWR: COMPATIBLE
      ATEN_CPU_CAPABILITY: default
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.15'
      - name: Install pinned CPU runtime
        run: |
          python -m pip install 'torch==2.14.1+cpu' 'numpy==2.5.2' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'pydantic>=2.7,<3'
      - name: Test actual multi-update arithmetic, repeats and evidence gate
        run: python -m unittest discover -s tests -p 'test_portable_full_training.py' -v
      - name: Download pinned source
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 38702282716 --repo '${{ github.repository }}' --name nppai-body-loss-full_response --dir source
      - name: Train native and both64 twice for the fixed 1024 updates
        run: python scripts/portable_full_training.py --source source --dataset evaluation/instruction-v3 --output measured
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: portable-full-${{ matrix.replica }}
          path: measured/
          retention-days: 14
  compare:
    needs: measure
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.15'
      - uses: actions/download-artifact@v4
        with:
          pattern: portable-full-*
          path: replicas
      - name: Verify actual repeat bytes and compare every step/checkpoint across CPU environments
        run: python -S scripts/portable_full_training.py --compare replicas
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: portable-full-comparison
          path: replicas/comparison.json
          retention-days: 14
