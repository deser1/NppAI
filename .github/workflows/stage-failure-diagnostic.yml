name: Frozen stage failure diagnostic
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/stage-failure-diagnostic.yml'
      - 'scripts/stage_failure_diagnostic.py'
      - 'scripts/audit_stage_failure.py'
      - 'tests/test_stage_failure*.py'
permissions:
  contents: read
  actions: read
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.15'
      - name: Install measured CPU runtime
        run: |
          python -m pip install 'torch==2.14.1+cpu' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'numpy==2.5.2' 'pydantic>=2.7,<3'
      - name: Test explicit assistance, target alignment and audit rejection
        run: python -m unittest discover -s tests -p 'test_stage_failure*.py' -v
      - name: Download both exact original pilot archives
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api 'repos/${{ github.repository }}/actions/artifacts/12149182157/zip' > first.zip
          gh api 'repos/${{ github.repository }}/actions/artifacts/12149930502/zip' > second.zip
      - name: Measure frozen training-only interventions and conditional bytes
        run: python scripts/stage_failure_diagnostic.py --archive first.zip --comparison second.zip --output measured
      - name: Reconstruct raw scores and intervention provenance
        run: python scripts/audit_stage_failure.py measured
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nppai-stage-failure-diagnostic
          path: measured/
          retention-days: 14
