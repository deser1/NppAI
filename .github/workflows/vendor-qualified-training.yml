name: Vendor-qualified full-training comparison
on:
  workflow_dispatch:
    inputs:
      intel_labels:
        description: 'JSON labels for an existing Ubuntu 24.04 x64 Intel runner'
        type: string
        default: '["ubuntu-24.04"]'
      amd_labels:
        description: 'JSON labels for an existing Ubuntu 24.04 x64 AMD runner'
        type: string
        default: '["ubuntu-24.04"]'
      certify:
        description: 'Fail the numerical gate unless actual AMD/Intel coverage and both64 equality pass'
        type: boolean
        default: false
  pull_request:
    paths:
      - '.github/workflows/vendor-qualified-training.yml'
      - 'scripts/vendor_pair_training.py'
      - 'tests/test_vendor_pair_training.py'
permissions:
  contents: read
  actions: read
jobs:
  measure:
    strategy:
      fail-fast: false
      matrix:
        vendor: [GenuineIntel, AuthenticAMD]
        replica: [1, 2]
    runs-on: ${{ fromJSON(matrix.vendor == 'GenuineIntel' && (inputs.intel_labels || '["ubuntu-24.04"]') || (inputs.amd_labels || '["ubuntu-24.04"]')) }}
    timeout-minutes: 20
    env:
      MKL_CBWR: COMPATIBLE
      ATEN_CPU_CAPABILITY: default
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.15'
      - name: Test hardware qualification contracts without optional dependencies
        run: python -S -m unittest discover -s tests -p 'test_vendor_pair_training.py' -v
      - name: Record actual CPU and OS before any training
        id: hardware
        env:
          EXPECTED_VENDOR: ${{ matrix.vendor }}
        run: python -S scripts/vendor_pair_training.py --expected-vendor "$EXPECTED_VENDOR" --output measured
      - name: Install pinned CPU runtime only on matching hardware
        if: steps.hardware.outputs.qualified == 'true'
        run: |
          python -m pip install 'torch==2.14.1+cpu' 'numpy==2.5.2' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'pydantic>=2.7,<3'
      - name: Test actual training and evidence guards
        if: steps.hardware.outputs.qualified == 'true'
        run: python -m unittest discover -s tests -p 'test_portable_full_training.py' -v
      - name: Download pinned source
        if: steps.hardware.outputs.qualified == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 38702282716 --repo '${{ github.repository }}' --name nppai-body-loss-full_response --dir source
      - name: Train the unchanged native/both64 recipes twice each
        if: steps.hardware.outputs.qualified == 'true'
        run: python scripts/portable_full_training.py --source source --dataset evaluation/instruction-v3 --output measured
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vendor-full-${{ matrix.vendor == 'GenuineIntel' && 'intel' || 'amd' }}-${{ matrix.replica }}
          path: measured/
          retention-days: 14
  compare:
    needs: measure
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.15'
      - uses: actions/download-artifact@v4
        with:
          pattern: vendor-full-*
          path: replicas
      - name: Report actual vendor coverage and the separate numerical verdict
        env:
          REQUIRE_PASSED_GATE: ${{ inputs.certify && 'true' || 'false' }}
        run: |
          if [ "$REQUIRE_PASSED_GATE" = true ]; then
            python -S scripts/vendor_pair_training.py --compare replicas --require-passed-gate
          else
            python -S scripts/vendor_pair_training.py --compare replicas
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vendor-qualified-comparison
          path: replicas/vendor-comparison.json
          retention-days: 14
