name: Identifier memorization probe
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/identifier_subset.py'
      - 'scripts/train_broader_instruction_experiment.py'
      - 'scripts/diagnose_identifier_copy.py'
      - 'tests/test_identifier_subset.py'
      - '.github/workflows/identifier-memorization-experiment.yml'
jobs:
  experiment:
    strategy:
      fail-fast: false
      matrix:
        training_names: [8, 512]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install measured CPU runtime
        run: python -m pip install 'torch==2.14.1+cpu' 'numpy==2.5.2' --index-url https://download.pytorch.org/whl/cpu
      - name: Check frozen data, selection and metrics
        run: python -m unittest tests.test_instruction_dataset tests.test_identifier_training tests.test_identifier_diagnostics tests.test_identifier_subset
      - name: Train fixed-budget memorization arm
        run: python scripts/train_broader_instruction_experiment.py --dataset evaluation/instruction-v3 --output memorization-experiment --steps 3000 --identifier-weight 1 --training-names ${{ matrix.training_names }}
      - name: Diagnose reloaded checkpoint
        run: python scripts/diagnose_identifier_copy.py --model memorization-experiment/NppAI-broader-instruction.nppai --dataset evaluation/instruction-v3 --output memorization-experiment/identifier-diagnostics.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nppai-identifier-memorization-${{ matrix.training_names }}-names
          path: memorization-experiment/
          retention-days: 14
