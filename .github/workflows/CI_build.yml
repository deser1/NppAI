name: CI_build

on: [push, pull_request]

jobs:
  build:

    runs-on: windows-2022
    strategy:
      max-parallel: 6
      matrix:
        build_configuration: [Release, Debug]
        build_platform: [x64, Win32, ARM64]

    steps:
    - name: Checkout repo
      uses: actions/checkout@v4

    - name: Add msbuild to PATH
      uses: microsoft/setup-msbuild@v3

    - name: MSBuild of plugin dll
      working-directory: vs.proj\
      run: msbuild NppAI.vcxproj /m /p:configuration="${{ matrix.build_configuration }}" /p:platform="${{ matrix.build_platform }}"

    - name: Configure CMake tests
      if: matrix.build_platform == 'x64' && matrix.build_configuration == 'Release'
      run: cmake -S . -B build-tests -A x64

    - name: Build CMake tests
      if: matrix.build_platform == 'x64' && matrix.build_configuration == 'Release'
      run: cmake --build build-tests --config Release

    - name: Run CTest
      if: matrix.build_platform == 'x64' && matrix.build_configuration == 'Release'
      run: ctest --test-dir build-tests -C Release --output-on-failure

    - name: Archive artifacts for x64
      if: matrix.build_platform == 'x64' && matrix.build_configuration == 'Release'
      uses: actions/upload-artifact@v4
      with:
          name: plugin_dll_x64
          path: bin64\NppAI.dll

    - name: Archive artifacts for Win32
      if: matrix.build_platform == 'Win32' && matrix.build_configuration == 'Release'
      uses: actions/upload-artifact@v4
      with:
          name: plugin_dll_x86
          path: bin\NppAI.dll

    - name: Archive artifacts for ARM64
      if: matrix.build_platform == 'ARM64' && matrix.build_configuration == 'Release'
      uses: actions/upload-artifact@v4
      with:
          name: plugin_dll_arm64
          path: arm64\NppAI.dll


  backend-tests:
    runs-on: windows-2022

    steps:
    - name: Checkout repo
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: pip

    - name: Install backend test dependencies
      run: python -m pip install "fastapi>=0.115,<1" "pydantic>=2.7,<3"

    - name: Run backend tests
      run: python -m unittest discover -s tests -p "test_server_backend.py" -v


  benchmark:
    runs-on: windows-2022

    steps:
    - name: Checkout repo
      uses: actions/checkout@v4

    - name: Configure tensor benchmark
      run: cmake -S . -B build-bench -A x64 -DNPPAI_BUILD_BENCHMARKS=ON

    - name: Build tensor benchmark
      run: cmake --build build-bench --config Release --target BenchmarkTensor

    - name: Run tensor benchmark
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Force benchmark-results | Out-Null
        & .\build-bench\Release\BenchmarkTensor.exe | Tee-Object -FilePath benchmark-results\tensor-benchmark.txt

    - name: Upload benchmark results
      uses: actions/upload-artifact@v4
      with:
        name: tensor-benchmark-x64
        path: benchmark-results\tensor-benchmark.txt
