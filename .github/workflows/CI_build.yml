name: CI_build

on: [push, pull_request]

jobs:
  build:

    runs-on: windows-2022
    strategy:
      max-parallel: 6
      matrix:
        build_configuration: [Release, Debug]
        build_platform: [x64, Win32, ARM64]

    steps:
    - name: Checkout repo
      uses: actions/checkout@v7

    - name: Add msbuild to PATH
      uses: microsoft/setup-msbuild@v3

    - name: MSBuild of plugin dll
      working-directory: vs.proj\
      run: msbuild NppAI.vcxproj /m /p:configuration="${{ matrix.build_configuration }}" /p:platform="${{ matrix.build_platform }}"

    - name: Configure CMake tests
      if: matrix.build_platform == 'x64' && matrix.build_configuration == 'Release'
      run: cmake -S . -B build-tests -A x64

    - name: Build CMake tests
      if: matrix.build_platform == 'x64' && matrix.build_configuration == 'Release'
      run: cmake --build build-tests --config Release

    - name: Run CTest
      if: matrix.build_platform == 'x64' && matrix.build_configuration == 'Release'
      run: ctest --test-dir build-tests -C Release --output-on-failure

    - name: Build plugin DLL contract test
      if: matrix.build_platform == 'x64' && matrix.build_configuration == 'Release'
      shell: pwsh
      run: cl /nologo /EHsc /std:c++17 tests\\test_plugin_dll_contract.cpp /Fe:TestPluginDllContract.exe

    - name: Run plugin DLL contract test
      if: matrix.build_platform == 'x64' && matrix.build_configuration == 'Release'
      shell: pwsh
      run: .\\TestPluginDllContract.exe .\\bin64\\NppAI.dll

    - name: Archive artifacts for x64
      if: matrix.build_platform == 'x64' && matrix.build_configuration == 'Release'
      uses: actions/upload-artifact@v7
      with:
          name: plugin_dll_x64
          path: bin64\NppAI.dll

    - name: Archive artifacts for Win32
      if: matrix.build_platform == 'Win32' && matrix.build_configuration == 'Release'
      uses: actions/upload-artifact@v7
      with:
          name: plugin_dll_x86
          path: bin\NppAI.dll

    - name: Archive artifacts for ARM64
      if: matrix.build_platform == 'ARM64' && matrix.build_configuration == 'Release'
      uses: actions/upload-artifact@v7
      with:
          name: plugin_dll_arm64
          path: arm64\NppAI.dll


  backend-tests:
    runs-on: windows-2022

    steps:
    - name: Checkout repo
      uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: pip

    - name: Install backend test dependencies
      run: python -m pip install "fastapi>=0.115,<1" "pydantic>=2.7,<3"

    - name: Run backend tests
      run: python -m unittest discover -s tests -p "test_server_backend.py" -v


  benchmark:
    runs-on: windows-2022

    steps:
    - name: Checkout repo
      uses: actions/checkout@v7

    - name: Configure tensor benchmark
      run: cmake -S . -B build-bench -A x64 -DNPPAI_BUILD_BENCHMARKS=ON

    - name: Build tensor benchmark
      run: cmake --build build-bench --config Release --target BenchmarkTensor

    - name: Run tensor benchmark
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Force benchmark-results | Out-Null
        $sizes = @(128, 256, 512, 1024)
        $samples = @{}
        foreach ($size in $sizes) {
          $samples[$size] = @{ fp32 = @(); int8 = @() }
        }

        1..5 | ForEach-Object {
          $output = & .\build-bench\Release\BenchmarkTensor.exe
          $output | Set-Content "benchmark-results\tensor-benchmark-$_.txt"
          $output | Where-Object { $_ -match '^(CPU_GPU|CPU:|GPU:|CPU/GPU ratio:|MAX_ABS_ERROR:)' } |
            Set-Content "benchmark-results\cpu-gpu-benchmark-$_.txt"

          for ($line = 0; $line -lt $output.Count; $line++) {
            if ($output[$line] -match '^SIZE ([0-9]+)x') {
              $size = [int]$Matches[1]
              $fp32Line = $output[$line + 1]
              $int8Line = $output[$line + 2]
              $samples[$size].fp32 += [double](($fp32Line -split '\s+')[1])
              $samples[$size].int8 += [double](($int8Line -split '\s+')[1])
            }
          }
        }

        function Get-Median([double[]]$values) {
          $sorted = @($values | Sort-Object)
          $middle = [int][math]::Floor($sorted.Count / 2)
          if ($sorted.Count % 2 -eq 0) {
            return ($sorted[$middle - 1] + $sorted[$middle]) / 2
          }
          return $sorted[$middle]
        }

        $summary = @("NppAI Tensor benchmark process median (5 runs)")
        foreach ($size in $sizes) {
          $fp32Median = Get-Median $samples[$size].fp32
          $int8Median = Get-Median $samples[$size].int8
          $ratio = $fp32Median / $int8Median
          $summary += "SIZE $size" + "x" + "$size"
          $summary += "FP32: $fp32Median ms/op"
          $summary += "INT8: $int8Median ms/op"
          $summary += "FP32/INT8 ratio: $ratio" + "x"
        }
        $summary | Tee-Object -FilePath benchmark-results\tensor-benchmark-summary.txt

        # Regression gate. These deliberately conservative ceilings are based
        # on the established windows-2022 x64 medians, with enough headroom
        # for normal shared-runner variance. They catch large regressions
        # without treating the benchmark as a precision performance test.
        $limits = @{
          128  = @{ fp32 = 0.0070; int8 = 0.0070 }
          256  = @{ fp32 = 0.0200; int8 = 0.0200 }
          512  = @{ fp32 = 0.0700; int8 = 0.0600 }
          1024 = @{ fp32 = 0.2700; int8 = 0.2200 }
        }

        $failures = @()
        foreach ($size in $sizes) {
          $fp32Median = Get-Median $samples[$size].fp32
          $int8Median = Get-Median $samples[$size].int8
          if ($fp32Median -gt $limits[$size].fp32) {
            $failures += "FP32 $size" + "x" + "${size}: $fp32Median ms/op > $($limits[$size].fp32)"
          }
          if ($int8Median -gt $limits[$size].int8) {
            $failures += "INT8 $size" + "x" + "${size}: $int8Median ms/op > $($limits[$size].int8)"
          }
        }

        if ($failures.Count -gt 0) {
          "Benchmark regression gate FAILED:" | Tee-Object -FilePath benchmark-results\regression-gate.txt
          $failures | Tee-Object -FilePath benchmark-results\regression-gate.txt -Append
          throw "Tensor benchmark exceeded regression ceiling."
        }
        "Benchmark regression gate PASSED." | Tee-Object -FilePath benchmark-results\regression-gate.txt

    - name: Upload benchmark results
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: tensor-benchmark-x64
        path: benchmark-results\*.txt
