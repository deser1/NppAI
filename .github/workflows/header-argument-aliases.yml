name: Matched header argument alias continuation
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/header_argument_aliases.py'
      - 'scripts/header_replay_training.py'
      - 'tests/test_argument_aliases.py'
      - '.github/workflows/header-argument-aliases.yml'
jobs:
  experiment:
    strategy:
      fail-fast: false
      matrix:
        policy: [fixed_arguments, varied_arguments]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install fixed CPU runtime
        run: python -m pip install 'torch==2.14.1+cpu' 'numpy==2.5.2' --index-url https://download.pytorch.org/whl/cpu
      - name: Verify alias isolation, replay matching and raw output audits
        run: python -m unittest tests.test_argument_aliases tests.test_header_original_replay tests.test_header_name_length tests.test_wording_continuation -v
      - name: Download fixed original four-form continuation and initialization
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 38618406741 --repo '${{ github.repository }}' --name nppai-continuation-evaluation-four_forms --dir source
          gh run download 38582420228 --repo '${{ github.repository }}' --name nppai-diverse-evaluation-four_forms --dir initial
      - name: Train fixed argument policy with unchanged original replay
        run: python scripts/header_argument_aliases.py --source source --initial initial --dataset evaluation/instruction-v3 --output argument-continuation --policy ${{ matrix.policy }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nppai-header-arguments-${{ matrix.policy }}
          path: argument-continuation/
          retention-days: 14
