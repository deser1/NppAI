name: Attention heads and rotary position experiment
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/attention_probe.py'
      - 'scripts/run_attention_probe.py'
      - 'tests/test_attention_probe.py'
      - '.github/workflows/attention-architecture-experiment.yml'
jobs:
  train:
    strategy:
      fail-fast: false
      matrix:
        arm: [legacy1, absolute4, rotary4]
        task: [headers, bodies]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install measured CPU runtime
        run: python -m pip install 'torch==2.14.1+cpu' 'numpy==2.5.2' --index-url https://download.pytorch.org/whl/cpu
      - name: Verify attention mathematics and frozen targets
        run: python -m unittest tests.test_attention_probe tests.test_staged_generation tests.test_prompt_robustness tests.test_identifier_headers tests.test_instruction_dataset
      - name: Train preselected architecture and task
        run: python scripts/run_attention_probe.py train --dataset evaluation/instruction-v3 --output probe-training --arm ${{ matrix.arm }} --task ${{ matrix.task }}
      - uses: actions/upload-artifact@v4
        with:
          name: nppai-attention-${{ matrix.arm }}-${{ matrix.task }}
          path: probe-training/
          retention-days: 14
  evaluate:
    needs: train
    strategy:
      fail-fast: false
      matrix:
        arm: [legacy1, absolute4, rotary4]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install measured CPU runtime
        run: python -m pip install 'torch==2.14.1+cpu' 'numpy==2.5.2' --index-url https://download.pytorch.org/whl/cpu
      - uses: actions/download-artifact@v4
        with:
          name: nppai-attention-${{ matrix.arm }}-headers
          path: header-source
      - uses: actions/download-artifact@v4
        with:
          name: nppai-attention-${{ matrix.arm }}-bodies
          path: body-source
      - name: Compare staged and free outputs on six wording forms
        run: python scripts/run_attention_probe.py replay --dataset evaluation/instruction-v3 --headers header-source --bodies body-source --output attention-evaluation --source-run ${{ github.run_id }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nppai-attention-evaluation-${{ matrix.arm }}
          path: attention-evaluation/
          retention-days: 14
