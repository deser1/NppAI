name: CPU training reproducibility diagnosis
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/training-repro.yml'
      - 'scripts/training_repro.py'
      - 'scripts/train_gated_copy.py'
      - 'tests/test_training_repro.py'
permissions:
  contents: read
  actions: read
jobs:
  diagnose:
    strategy:
      fail-fast: false
      matrix:
        profile: [historical-v1, portable-cpu-v1]
        replica: [1, 2]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.15'
      - name: Install pinned CPU runtime
        run: |
          python -m pip install 'torch==2.14.1+cpu' 'numpy==2.5.2' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'pydantic>=2.7,<3'
      - name: Test diagnostic contracts
        run: python -m unittest discover -s tests -p 'test_training_repro.py' -v
      - name: Download pinned source
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 38702282716 --repo '${{ github.repository }}' --name nppai-body-loss-full_response --dir source
      - name: Repeat control twice and retain historical failures
        env:
          PROFILE: ${{ matrix.profile }}
        run: |
          if [ "$PROFILE" = portable-cpu-v1 ]; then
            export MKL_CBWR=COMPATIBLE ATEN_CPU_CAPABILITY=default OMP_NUM_THREADS=1 OPENBLAS_NUM_THREADS=1
          fi
          python scripts/training_repro.py --source source --dataset evaluation/instruction-v3 --output measured --profile "$PROFILE"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: training-repro-${{ matrix.profile }}-${{ matrix.replica }}
          path: measured/
          retention-days: 14
  compare:
    needs: diagnose
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.15'
      - uses: actions/download-artifact@v4
        with:
          pattern: training-repro-*
          path: replicas
      - name: Compare independently provisioned runners
        run: python scripts/training_repro.py --compare replicas
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: training-repro-comparison
          path: replicas/comparison.json
          retention-days: 14
