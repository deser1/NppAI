name: Unseen wording regression gate

on:
  pull_request:
    paths:
      - 'tests/test_unseen_wording_gate.py'
      - 'scripts/build_instruction_dataset.py'
      - 'evaluation/instruction-v*/**'
      - '.github/workflows/unseen-wording-gate.yml'
  workflow_dispatch:

jobs:
  dataset-and-name-regressions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify frozen split isolation and generated code diagnostics
        run: python -m unittest tests.test_unseen_wording_gate -v
