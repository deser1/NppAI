name: Wording audit infrastructure regressions

on:
  pull_request:
    paths:
      - 'tests/test_unseen_wording_gate.py'
      - 'tests/test_wording_report_audit.py'
      - 'scripts/audit_wording_report.py'
      - 'scripts/evaluate_staged_generation.py'
      - 'scripts/prompt_robustness.py'
      - 'scripts/build_instruction_dataset.py'
      - 'evaluation/instruction-v*/**'
      - '.github/workflows/unseen-wording-gate.yml'
  workflow_dispatch:

jobs:
  dataset-and-name-regressions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify frozen split isolation and generated code diagnostics
        run: python -m unittest tests.test_unseen_wording_gate tests.test_wording_report_audit -v
