name: Learned header and body generation experiment
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/evaluate_staged_generation.py'
      - 'tests/test_staged_generation.py'
      - '.github/workflows/staged-generation-experiment.yml'
jobs:
  experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install measured CPU runtime
        run: python -m pip install 'torch==2.14.1+cpu' 'numpy==2.5.2' --index-url https://download.pytorch.org/whl/cpu
      - name: Check header acceptance and whole-function metrics
        run: python -m unittest tests.test_staged_generation tests.test_instruction_dataset
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 38325353585
          name: nppai-real-prompt-headers
          path: header-source
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 38325353585
          name: nppai-real-prompt-full-code
          path: body-source
      - name: Compare learned-header pipeline and frozen body-model baseline
        run: python scripts/evaluate_staged_generation.py --headers header-source --bodies body-source --dataset evaluation/instruction-v3 --output staged-experiment --source-run 38325353585
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nppai-learned-header-body-evaluation
          path: staged-experiment/
          retention-days: 14
