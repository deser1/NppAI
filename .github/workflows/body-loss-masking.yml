name: Matched body-only loss continuation
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/body_loss_masking.py'
      - 'tests/test_body_loss_masking.py'
      - '.github/workflows/body-loss-masking.yml'
jobs:
  experiment:
    strategy:
      fail-fast: false
      matrix:
        policy: [full_response, body_only]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install fixed CPU runtime
        run: python -m pip install 'torch==2.14.1+cpu' 'numpy==2.5.2' --index-url https://download.pytorch.org/whl/cpu
      - name: Verify masks, gradients, draw exposure and raw evidence
        run: python -m unittest tests.test_body_loss_masking tests.test_body_argument_aliases tests.test_wording_continuation -v
      - name: Download fixed body continuation and initial source pair
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 38618406741 --repo '${{ github.repository }}' --name nppai-continuation-evaluation-four_forms --dir source
          gh run download 38582420228 --repo '${{ github.repository }}' --name nppai-diverse-evaluation-four_forms --dir initial
      - name: Continue same varied-argument data with fixed loss policy
        run: python scripts/body_loss_masking.py --source source --initial initial --dataset evaluation/instruction-v3 --output body-loss --policy ${{ matrix.policy }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nppai-body-loss-${{ matrix.policy }}
          path: body-loss/
          retention-days: 14
