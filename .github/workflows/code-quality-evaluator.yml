name: Code quality evaluator tests

on:
  push:
    paths:
      - 'scripts/evaluate_code_quality.py'
      - 'scripts/import_generation_outputs.py'
      - 'scripts/capture_model_code_outputs.py'
      - 'scripts/run_model_code_evaluation.py'
      - 'tests/test_model_code_evaluation.py'
      - 'tests/test_model_code_capture.py'
      - 'tests/test_generation_output_import.py'
      - 'tests/test_code_quality_evaluator.py'
      - 'evaluation/code-quality/**'
      - '.github/workflows/code-quality-evaluator.yml'
  pull_request:
    paths:
      - 'scripts/evaluate_code_quality.py'
      - 'tests/test_code_quality_evaluator.py'
      - 'evaluation/code-quality/**'
      - '.github/workflows/code-quality-evaluator.yml'

jobs:
  evaluator-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run evaluator regression tests
        run: python -m unittest discover -s tests -p 'test_*quality*.py' -v
      - name: Test generation output importer
        run: python -m unittest discover -s tests -p test_generation_output_import.py -v
      - name: Test model generation capture adapter
        run: python -m unittest discover -s tests -p test_model_code_capture.py -v
      - name: Test complete model evaluation pipeline
        run: python -m unittest discover -s tests -p test_model_code_evaluation.py -v
