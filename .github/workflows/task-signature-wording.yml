name: Task-signature body wording diagnostic
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/evaluate_task_signature_wording.py'
      - 'tests/test_task_signature_wording.py'
      - '.github/workflows/task-signature-wording.yml'
jobs:
  evaluate:
    runs-on: windows-2022
    timeout-minutes: 35
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify task signatures and frozen cached controls
        run: python -m unittest tests.test_task_signature_wording tests.test_signature_guidance tests.test_native_staged tests.test_wording_report_audit
      - name: Install measured CPU reference runtime
        run: python -m pip install 'torch==2.14.1+cpu' 'numpy==2.5.2' --index-url https://download.pytorch.org/whl/cpu
      - name: Download fixed learned-header and free-body controls
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 38591181871 --repo '${{ github.repository }}' --name nppai-native-staged-comparison --dir frozen-replay
      - name: Build unchanged native diagnostic runner
        run: |
          cmake -S . -B build-signature-wording -A x64
          cmake --build build-signature-wording --config Release --target StagedNativeRunner
      - name: Measure explicitly assisted body generation on six forms
        run: >-
          python scripts/evaluate_task_signature_wording.py
          --source frozen-replay
          --dataset evaluation/instruction-v3
          --engine build-signature-wording/Release/StagedNativeRunner.exe
          --output task-signature-diagnostic
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nppai-task-signature-wording-diagnostic
          path: task-signature-diagnostic/
          retention-days: 14
