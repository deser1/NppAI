name: Fixed CPU arithmetic variants
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/arithmetic-variants.yml'
      - 'scripts/arithmetic_variants.py'
      - 'tests/test_arithmetic_variants.py'
permissions:
  contents: read
  actions: read
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.15'
      - name: Download fixed prior operator snapshots
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 38905715952 --repo '${{ github.repository }}' --name first-step-historical-v1-1 --dir raw/softmax
          gh run download 38906998886 --repo '${{ github.repository }}' --name operator-tensors-portable-cpu-v1-1 --dir raw/sqrt
      - name: Verify and package only frozen input bytes
        run: python -S scripts/arithmetic_variants.py --prepare raw --output frozen
      - uses: actions/upload-artifact@v4
        with:
          name: frozen-operator-inputs
          path: frozen/
          retention-days: 14
  measure:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        profile: [historical-v1, portable-cpu-v1]
        replica: [1, 2, 3, 4]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.15'
      - name: Install pinned CPU runtime
        run: |
          python -m pip install 'torch==2.14.1+cpu' 'numpy==2.5.2' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'pydantic>=2.7,<3'
      - name: Test actual arithmetic and phase isolation
        run: python -m unittest discover -s tests -p 'test_arithmetic_variants.py' -v
      - uses: actions/download-artifact@v4
        with:
          name: frozen-operator-inputs
          path: frozen
      - name: Download pinned starting model
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 38702282716 --repo '${{ github.repository }}' --name nppai-body-loss-full_response --dir source
      - name: Measure all four variants twice from identical initial weights
        env:
          PROFILE: ${{ matrix.profile }}
        run: |
          if [ "$PROFILE" = portable-cpu-v1 ]; then
            export MKL_CBWR=COMPATIBLE ATEN_CPU_CAPABILITY=default OMP_NUM_THREADS=1 OPENBLAS_NUM_THREADS=1
          fi
          python scripts/arithmetic_variants.py --source source --dataset evaluation/instruction-v3 --inputs frozen --output measured --profile "$PROFILE"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arithmetic-${{ matrix.profile }}-${{ matrix.replica }}
          path: measured/
          retention-days: 14
  compare:
    needs: measure
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.15'
      - uses: actions/download-artifact@v4
        with:
          pattern: arithmetic-*
          path: replicas
      - name: Compare operators, gradients and updated parameters
        run: python -S scripts/arithmetic_variants.py --compare replicas
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arithmetic-comparison
          path: replicas/comparison.json
          retention-days: 14
