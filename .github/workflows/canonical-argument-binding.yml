name: Frozen canonical argument binding diagnostic
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/evaluate_canonical_binding.py'
      - 'tests/test_canonical_binding.py'
      - '.github/workflows/canonical-argument-binding.yml'
jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install fixed CPU runtime
        run: python -m pip install 'torch==2.14.1+cpu' 'numpy==2.5.2' --index-url https://download.pytorch.org/whl/cpu
      - name: Verify prompt transforms, scope limits and raw report audit
        run: python -m unittest tests.test_canonical_binding tests.test_body_argument_aliases tests.test_wording_continuation -v
      - name: Download pinned full-response control
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 38697039023 --repo '${{ github.repository }}' --name nppai-body-arguments-fixed_arguments --dir source
      - name: Compare fixed normalization policies with cached direct assistance
        run: python scripts/evaluate_canonical_binding.py --source source --dataset evaluation/instruction-v3 --output binding
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nppai-canonical-argument-binding
          path: binding/
          retention-days: 14
