name: Released model generalization
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/released-model-evaluation.yml'
      - 'evaluation/released-generalization-v1/**'
      - 'scripts/evaluate_released_model.py'
      - 'tests/test_released_model_evaluation.py'
permissions:
  contents: read
jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'numpy==2.3.5' 'pydantic>=2.7,<3'
      - run: python -m unittest discover -s tests -p test_released_model_evaluation.py -v
      - name: Fetch immutable released checkpoint and isolated execution image
        run: |
          curl -fL https://github.com/deser1/NppAI/releases/download/model-factorial-v1/NppAI-factorial.nppai -o released.nppai
          echo 'f8ef88dccbbd3280c21e5acd51c41c6744e6ba597aa63686f3f43fd96beac229  released.nppai' | sha256sum -c -
          docker pull python:3.12-slim
          echo "NPPAI_VALIDATION_IMAGE=$(docker image inspect python:3.12-slim --format '{{.Id}}')" >> "$GITHUB_ENV"
      - name: Frozen first-pass paired readout and actual Docker tests
        run: python scripts/evaluate_released_model.py --model released.nppai --output measured --image "$NPPAI_VALIDATION_IMAGE"
      - name: Audit complete raw evidence (quality failures remain reported)
        run: python scripts/evaluate_released_model.py --model released.nppai --output measured --audit measured/report.json
      - name: Require container cleanup
        if: always()
        run: test -z "$(docker ps -aq --filter name=nppai-validate-)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: released-generalization-v1
          path: measured/
          retention-days: 90
