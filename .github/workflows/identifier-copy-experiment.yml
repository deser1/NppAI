name: Identifier copying training experiment
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/build_instruction_dataset.py'
      - 'scripts/train_broader_instruction_experiment.py'
      - 'evaluation/instruction-v3/**'
      - 'tests/test_identifier_training.py'
      - 'tests/test_instruction_dataset.py'
      - '.github/workflows/identifier-copy-experiment.yml'
jobs:
  experiment:
    strategy:
      fail-fast: false
      matrix:
        identifier_weight: [1, 4]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install measured CPU runtime
        run: python -m pip install 'torch==2.14.1+cpu' 'numpy==2.5.2' --index-url https://download.pytorch.org/whl/cpu
      - name: Check dataset isolation and response loss masks
        run: python -m unittest tests.test_instruction_dataset tests.test_identifier_training
      - name: Train paired fixed-budget arm
        run: python scripts/train_broader_instruction_experiment.py --dataset evaluation/instruction-v3 --output identifier-experiment --steps 3000 --identifier-weight ${{ matrix.identifier_weight }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nppai-identifier-v3-weight-${{ matrix.identifier_weight }}
          path: identifier-experiment/
          retention-days: 14
