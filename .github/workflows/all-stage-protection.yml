name: All-stage replay versus frozen own planner
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/all-stage-protection.yml'
      - 'experimental_stage_router.py'
      - 'scripts/all_stage_protection.py'
      - 'scripts/audit_all_stage_protection.py'
      - 'evaluation/all-stage-protection-v1.json'
      - 'tests/test_all_stage_protection*.py'
permissions:
  contents: read
  actions: read
jobs:
  protect-and-validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.15'
      - name: Install measured CPU runtime
        run: |
          python -m pip install 'torch==2.14.1+cpu' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'numpy==2.5.2' 'pydantic>=2.7,<3'
      - name: Verify stage roles, identity, raw audit and real gradients
        run: python -m unittest discover -s tests -p 'test_all_stage_protection*.py' -v
      - name: Download exact own-model source and previously trained coder
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api 'repos/${{ github.repository }}/actions/artifacts/12149182157/zip' > original.zip
          gh api 'repos/${{ github.repository }}/actions/artifacts/12152565374/zip' > coder.zip
      - name: Prepare isolated functional validator
        run: |
          docker pull python:3.12-slim
          printf 'NPPAI_VALIDATION_IMAGE=%s\n' "$(docker image inspect python:3.12-slim --format '{{.Id}}')" >> "$GITHUB_ENV"
      - name: Train fixed all-stage replay and measure both protection strategies
        run: python scripts/all_stage_protection.py --original original.zip --coder coder.zip --output measured --image "$NPPAI_VALIDATION_IMAGE"
      - name: Audit identities, frozen artifacts, raw outputs and retention
        run: python scripts/audit_all_stage_protection.py measured
      - name: Require validator cleanup
        if: always()
        run: test -z "$(docker ps -aq --filter name=nppai-validate-)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nppai-all-stage-protection
          path: measured/
          retention-days: 14
