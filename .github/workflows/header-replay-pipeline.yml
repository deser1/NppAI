name: Frozen header replay complete body diagnostic
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/diagnose_header_replay.py'
      - 'tests/test_replay_pipeline.py'
      - '.github/workflows/header-replay-pipeline.yml'
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install fixed CPU runtime
        run: python -m pip install 'torch==2.14.1+cpu' 'numpy==2.5.2' --index-url https://download.pytorch.org/whl/cpu
      - name: Verify argument diagnosis, complete references and raw evidence audit
        run: python -m unittest tests.test_replay_pipeline tests.test_header_original_replay tests.test_header_name_length tests.test_wording_continuation -v
      - name: Download fixed replay headers, common body and original initialization
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 38635038956 --repo '${{ github.repository }}' --name nppai-header-replay-no_replay --dir no-replay
          gh run download 38635038956 --repo '${{ github.repository }}' --name nppai-header-replay-half_original --dir half-original
          gh run download 38618406741 --repo '${{ github.repository }}' --name nppai-continuation-evaluation-four_forms --dir body-pair
          gh run download 38582420228 --repo '${{ github.repository }}' --name nppai-diverse-evaluation-four_forms --dir initial
      - name: Audit frozen headers and compare complete staged outputs without training
        run: python scripts/diagnose_header_replay.py --no-replay no-replay --half-original half-original --body-pair body-pair --initial initial --dataset evaluation/instruction-v3 --output pipeline-diagnostic
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nppai-header-replay-pipeline
          path: pipeline-diagnostic/
          retention-days: 14
