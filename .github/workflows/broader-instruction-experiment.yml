name: Frozen broader instruction experiment
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/build_instruction_dataset.py'
      - 'scripts/train_broader_instruction_experiment.py'
      - 'evaluation/instruction-v1/**'
      - 'tests/test_instruction_dataset.py'
      - '.github/workflows/broader-instruction-experiment.yml'
jobs:
  experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify task isolation and reference syntax
        run: python -m unittest tests.test_instruction_dataset
      - name: Install CPU training runtime
        run: |
          python -m pip install numpy
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Train fixed budget and evaluate frozen tasks
        run: python scripts/train_broader_instruction_experiment.py --dataset evaluation/instruction-v1 --output broader-experiment --steps 3000
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nppai-broader-instruction-experiment
          path: broader-experiment/
          retention-days: 14
