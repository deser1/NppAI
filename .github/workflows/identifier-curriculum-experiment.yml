name: Identifier copying curriculum experiment
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/train_identifier_echo.py'
      - 'scripts/train_broader_instruction_experiment.py'
      - 'scripts/identifier_curriculum.py'
      - 'tests/test_identifier_curriculum.py'
      - '.github/workflows/identifier-curriculum-experiment.yml'
jobs:
  experiment:
    strategy:
      fail-fast: false
      matrix:
        arm: [code3000, code6000, echo3000-code3000]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install measured CPU runtime
        run: python -m pip install 'torch==2.14.1+cpu' 'numpy==2.5.2' --index-url https://download.pytorch.org/whl/cpu
      - name: Check checkpoint compatibility and frozen metrics
        run: python -m unittest tests.test_identifier_curriculum tests.test_identifier_echo tests.test_identifier_training tests.test_identifier_diagnostics tests.test_instruction_dataset
      - name: Pretrain copying without reading held-out names
        if: matrix.arm == 'echo3000-code3000'
        run: python scripts/train_identifier_echo.py --dataset evaluation/instruction-v3 --output curriculum-experiment/echo-stage --steps 3000 --context 256 --training-only
      - name: Train direct code arm
        if: matrix.arm != 'echo3000-code3000'
        shell: bash
        run: |
          steps=3000
          if [ '${{ matrix.arm }}' = 'code6000' ]; then steps=6000; fi
          python scripts/train_broader_instruction_experiment.py --dataset evaluation/instruction-v3 --output curriculum-experiment/code-stage --steps "$steps" --identifier-weight 1 --training-names 512
      - name: Train code after copying
        if: matrix.arm == 'echo3000-code3000'
        run: python scripts/train_broader_instruction_experiment.py --dataset evaluation/instruction-v3 --output curriculum-experiment/code-stage --steps 3000 --identifier-weight 1 --training-names 512 --initial-model curriculum-experiment/echo-stage/NppAI-identifier-echo.nppai
      - name: Diagnose reloaded final checkpoint
        run: python scripts/diagnose_identifier_copy.py --model curriculum-experiment/code-stage/NppAI-broader-instruction.nppai --dataset evaluation/instruction-v3 --output curriculum-experiment/code-stage/identifier-diagnostics.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nppai-curriculum-${{ matrix.arm }}
          path: curriculum-experiment/
          retention-days: 14
