name: Frozen argument signature assistance diagnostic
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/evaluate_argument_assistance.py'
      - 'tests/test_argument_assistance.py'
      - '.github/workflows/argument-signature-assistance.yml'
jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install fixed CPU runtime
        run: python -m pip install 'torch==2.14.1+cpu' 'numpy==2.5.2' --index-url https://download.pytorch.org/whl/cpu
      - name: Verify prompt-only parser, reference mapping and assisted evidence audit
        run: python -m unittest tests.test_argument_assistance tests.test_argument_aliases tests.test_replay_pipeline tests.test_wording_continuation -v
      - name: Download pinned cached header sources and common body initialization
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 38642891392 --repo '${{ github.repository }}' --name nppai-header-arguments-fixed_arguments --dir fixed-arguments
          gh run download 38642891392 --repo '${{ github.repository }}' --name nppai-header-arguments-varied_arguments --dir varied-arguments
          gh run download 38618406741 --repo '${{ github.repository }}' --name nppai-continuation-evaluation-four_forms --dir body-pair
          gh run download 38582420228 --repo '${{ github.repository }}' --name nppai-diverse-evaluation-four_forms --dir initial
      - name: Compare cached learned and prompt-derived headers with the same frozen body
        run: python scripts/evaluate_argument_assistance.py --fixed-arguments fixed-arguments --varied-arguments varied-arguments --body-pair body-pair --initial initial --dataset evaluation/instruction-v3 --output argument-assistance
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nppai-argument-signature-assistance
          path: argument-assistance/
          retention-days: 14
